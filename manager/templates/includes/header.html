{% load static %}

<nav class="navbar navbar-expand-lg navbar-dark top-navbar-container">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'core:index' %}">
      <img src="{% static 'img/logo.png' %}" width="120" height="40" class="d-inline-block align-top" alt="">
    </a>
    <div class="navbar-title">Учет выдачи СИЗ</div>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse navbar-actions-container m-1-8 m-r-8" id="navbarNavDropdown">
      <ul class="navbar-nav ms-auto profile-container ai-center">
        <li class="nav-item">
          <a class="nav-link {% if view_name == 'core:employee_list' %}active{% endif %}" href="{% url 'core:employee_list' %}">Список работников</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if view_name == 'core:position_list' %}active{% endif %}" href="{% url 'core:position_list' %}">Список должностей</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if view_name == 'core:height_group_list' %}active{% endif %}" href="{% url 'core:height_group_list' %}">Группы по высоте</a>
        </li>
        <li class="nav-item theme-switcher-item">
          <button
            type="button"
            class="theme-switcher"
            data-theme-toggle
            data-theme-current="{{ ui_theme|default:'light' }}"
            data-theme-next="{% if ui_theme == 'dark' %}light{% else %}dark{% endif %}"
            aria-label="Переключить тему"
            title="Переключить тему"
          >
            <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
            <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
          </button>
        </li>

        {% if user.is_authenticated %}
          <li class="nav-item">
            <div class="divider"></div>
          </li>
          <li class="nav-item dropdown user-menu-item">
            <button class="nav-link dropdown-toggle user-menu-toggle {% if view_name == 'core:profile' or view_name == 'users:password_change' or view_name == 'users:logout' %}active{% endif %}" type="button" id="navbarDropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              <span class="column-container">
                <span>{{ user.last_name }}</span>
                <span>{{ user.first_name }}</span>
              </span>
            </button>
            <ul class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
              <li><a class="dropdown-item" href="{% url 'core:profile' username=user.username %}">Профиль</a></li>
              <li><a class="dropdown-item" href="{% url 'users:password_change' %}">Изменить пароль</a></li>
              <li><a class="dropdown-item" href="{% url 'users:logout' %}">Выйти</a></li>
            </ul>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'users:login' %}active{% endif %}" href="{% url 'users:login' %}">Войти</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if view_name == 'users:signup' %}active{% endif %}" href="{% url 'users:signup' %}">Регистрация</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
